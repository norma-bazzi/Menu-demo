<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Menu Demo</title>
<meta name="description" content="A demo of an interactive restaurant menu. Scroll and watch every dish build itself.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#140b07">
<meta property="og:type" content="website">
<meta property="og:title" content="Interactive Menu Demo">
<meta property="og:description" content="Scroll the menu and watch every dish build itself. A demo that any restaurant can adapt.">
<meta property="og:image" content="https://norma-bazzi.github.io/Menu-demo/img/og.jpg">
<meta property="og:url" content="https://norma-bazzi.github.io/Menu-demo/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#kitchen">Skip the menu animation</a>
<canvas id="embers" aria-hidden="true"></canvas>

<header class="site-header">
  <a class="logo" href="#menu" aria-label="Your Restaurant, back to top">LOGO<span class="demo-tag">Demo</span></a>
  <nav class="main-nav" aria-label="Primary">
    <a href="#menu" class="is-current">Menu</a><span aria-hidden="true">·</span>
    <a href="#kitchen">Our kitchen</a><span aria-hidden="true">·</span>
    <a href="#visit">Visit</a>
  </nav>
  <button class="bag" id="bagBtn" aria-label="Open your order" aria-haspopup="dialog" aria-controls="drawer">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8Z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/>
    </svg>
    <span class="bag-count" id="bagCount" aria-hidden="true">0</span>
  </button>
</header>

<nav class="cat-bar" id="catBar" aria-label="Menu categories"></nav>
<div class="scroll-progress" aria-hidden="true"><span id="progressFill"></span></div>

<main>
  <section class="hero" id="hero" aria-label="Welcome"></section>
  <section class="menu" id="menu" aria-label="Menu">
    <div class="stage" id="stage">
      <div class="stage-light" aria-hidden="true"></div>
      <canvas id="stageCanvas" role="img" aria-label="Animated dish building as you scroll"></canvas>
      <div class="hero-copy" id="heroCopy">
        <p class="hero-tag" id="heroTag"></p>
        <p class="hero-hint">Scroll to build <span aria-hidden="true">↓</span></p>
      </div>
      <div class="panels" id="panels"></div>
    </div>
    <div class="spacer" id="heroSpacer"></div>
    <div id="spacers"></div>
  </section>

  <section class="kitchen" id="kitchen"></section>
  <section class="visit" id="visit"></section>

  <footer class="site-footer">
    <span class="logo small">LOGO</span>
    <span>Interactive menu demo for any restaurant.</span>
  </footer>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="drawerTitle">Your order</h2>
    <button class="icon-btn" id="drawerClose" aria-label="Close order">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.4" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot">
    <div class="total-row"><span>Total</span><span id="cartTotal">$0</span></div>
    <button class="btn btn-primary btn-block" id="checkoutBtn">Checkout</button>
  </div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/menu-data.js"></script>
<script src="js/renderers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
